name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and latest: 3.10 is the minimum the `mcp` SDK supports (see
        # README Quickstart); 3.14 catches breakage from new releases.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline tests (no network)
        # The live NASA POWER test is opt-in via CROP_ADVISOR_LIVE_TESTS and is
        # deliberately not run here, so a third-party outage can't fail CI.
        run: python -m unittest discover -s tests -v
