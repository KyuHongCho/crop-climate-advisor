[mutmut]
# Mutation testing: mutmut breaks the source on purpose, one change at a time,
# and reports any mutant the suite still lets pass — behaviour that is executed
# but never actually asserted on.
#
# source_paths is required here. mutmut's _guess_source_paths() looks for a
# directory matching the repo folder name: from "crop-climate-advisor" it tries
# "crop_climate_advisor", finds nothing (the package is "crop_advisor"), and
# raises FileNotFoundError — even for `mutmut --version`.
source_paths = crop_advisor

# mutmut runs the suite from a generated mutants/ copy. It copies source_paths
# plus a built-in default list (tests, test, setup.cfg, pyproject.toml, *.lock).
# These two are read at runtime but are NOT in that default list, so without
# them collection fails inside mutants/:
#   data/      -> crop_advisor/ecocrop.py:10, tests/test_claims.py:17,
#                 tests/test_divergence.py:30, tests/test_suitability.py:9
#   README.md  -> tests/test_cli_format.py:152
also_copy =
    data
    README.md

# WARNING: if a pyproject.toml containing a [tool.mutmut] section is ever added,
# THIS FILE IS SILENTLY IGNORED — mutmut/configuration.py checks pyproject.toml
# first and only falls back to setup.cfg when [tool.mutmut] is absent there.
